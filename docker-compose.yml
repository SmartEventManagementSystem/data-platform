# ============================================================
# EMS Data Platform - Main Compose File
# ============================================================
# Modular architecture - each module is in compose/ directory
#
# Usage:
#   docker compose up -d           # Start all services
#   docker compose --profile analytics up -d  # Include analytics
#   docker compose --profile connectors up -d # Include Kafka Connect
#   docker compose up -d kafka redis openmetadata  # Start specific services
# ============================================================

include:
  - path: compose/base.yml
  - path: compose/kafka.yml
  - path: compose/databases.yml
  - path: compose/redis.yml
  - path: compose/airflow.yml
  - path: compose/openmetadata.yml
  - path: compose/lakehouse.yml
  - path: compose/processing.yml
  - path: compose/analytics.yml
    profiles:
      - analytics
  - path: compose/vector.yml
