# ============================================================
# OpenMetadata - Data Catalog & Discovery (MySQL)
# ============================================================

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    hostname: elasticsearch
    container_name: ems-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enrollment.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - dataplatform
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:elastic123 http://localhost:9200 | grep -q 'cluster_name'"]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 5

  openmetadata:
    image: openmetadata/server:1.5.0
    hostname: openmetadata
    container_name: ems-openmetadata
    ports:
      - "8585:8585"
      - "8586:8586"
    environment:
      # MySQL configuration (OM default)
      DB_HOST: mysql-om
      DB_PORT: 3306
      DB_USER: openmetadata
      DB_PASSWORD: openmetadata123
      DB_SCHEME: mysql
      OM_DATABASE: openmetadata

      # Server config
      OPENMETADATA_VERSION: 1.5.0
      SERVER_PORT: 8585
      LOG_LEVEL: INFO
      CUSTOM_OIDC_AUTHENTICATION_ENABLED: 'false'

      # Airflow connection
      AIRFLOW_HOST: airflow-webserver
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: admin123
      AIRFLOW_PORT: 8080

      # Elasticsearch
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200

      # Kafka
      KAFKA_BOOTSTRAPERS: kafka:29092
      KAFKA_SCHEMAREGISTRY: http://schema-registry:8081
    depends_on:
      mysql-om:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - dataplatform
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8585/healthcheck || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 30
    restart: unless-stopped

  openmetadata-ingestion:
    image: openmetadata/ingestion:1.5.0
    hostname: openmetadata-ingestion
    container_name: ems-openmetadata-ingestion
    depends_on:
      - openmetadata
      - postgres-airflow
    environment:
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      DB_HOST: mysql-om
      DB_PORT: 3306
      DB_USER: openmetadata
      DB_PASSWORD: openmetadata123
      DB_SCHEME: mysql
      OM_DATABASE: openmetadata
    volumes:
      - ./dags:/opt/airflow/dags
      - openmetadata-ingestion:/opt/airflow
    networks:
      - dataplatform
    restart: unless-stopped
