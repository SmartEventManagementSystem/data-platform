# ============================================================
# OpenMetadata Standalone - Alternative to embedded OpenMetadata
# Use this if you want OpenMetadata as a separate deployment
#
# Run with: docker compose -f docker-compose.yml -f docker-compose.openmetadata.yml up -d
# NOTE: Uses PostgreSQL driver (not MySQL)
# ============================================================

include:
  - path: compose/base.yml
  - path: compose/kafka.yml
  - path: compose/databases.yml
  - path: compose/openmetadata.yml

services:
  # Override postgres-om to use separate database for standalone OM
  postgres-om:
    environment:
      POSTGRES_USER: openmetadata
      POSTGRES_PASSWORD: openmetadata123
      POSTGRES_DB: openmetadata_standalone
