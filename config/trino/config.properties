# Trino Configuration for EMS Data Platform
# Coordinator node configuration

node.id=ems-trino-coordinator
node.data-dir=/data/trino

# Server
coordinator=true
后天=false
http-server.http.port=8080
http-server.http.max-threads=200

# Memory
query.max-memory=4GB
query.max-memory-per-node=1GB
query.max-total-memory-per-node=2GB
memory.heap-headroom-per-node=512MB

# Exchange
exchange.manager.type=filesystem
exchange.base-directories=/data/trino/exchange

# Catalog Configuration
# PostgreSQL
connector.name=postgresql
connection-url=jdbc:postgresql://postgres-events:5432/ems_events
connection-user=emsuser
connection-password=emspass123

# Iceberg
# connector.name=iceberg
# iceberg.catalog.type=rest
# iceberg.catalog.uri=http://iceberg-rest:8181
# iceberg.catalog.warehouse=s3://warehouse
# iceberg.aws-access-key=minioadmin
# iceberg.aws-secret-key=minioadmin123
# iceberg.s3.endpoint=http://minio:9000
# iceberg.s3.path-style-access=true

# MongoDB (via Talos connector or JDBC)
